# .github/workflows/ci.yml
name: Pipeline CI/CD EADL - Core Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_test_security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js (v18) 💻
        uses: actions/setup-node@v4
        with:
          node-version: '18' 
          cache: 'yarn' 

      - name: Install dependencies 📦
        run: yarn install

      # =======================================================
      # 1. QUALITÉ ET SÉCURITÉ DU CODE
      # =======================================================

      - name: 1. Qualité du Code (Linting & Types) 🔎
        # Ce script vérifie le code TypeScript/JavaScript
        run: yarn types

      - name: 2. Sécurité des Dépendances (Yarn Audit) 🛡️
        # Détecte les vulnérabilités dans les librairies utilisées.
        run: yarn audit --level moderate --groups dependencies

      # =======================================================
      # 2. TESTS E2E (CYPRESS)
      # =======================================================

      - name: 3. Démarrer l'application RWA en arrière-plan ⚙️
        # L'application (frontend sur 3000, backend sur 3001) doit être active pour les tests E2E.
        # 'start-server-and-test' est la meilleure méthode en CI.
        uses: cypress-io/start-server-and-test@v1.23.1
        with:
          start: yarn start # La commande qui lance le front et le back
          wait-on: 'http://localhost:3000' # Attend que cette URL réponde
          timeout: 120 # Donne 2 minutes pour démarrer

      - name: 4. Exécuter les Tests E2E avec Cypress 🧪
        # Exécute tous les fichiers de tests (UI et API) en mode headless
        uses: cypress-io/github-action@v6
        with:
          # On réutilise la commande de démarrage au cas où, mais le 'wait-on' est suffisant
          command: yarn cypress:run 
          wait-on: 'http://localhost:3000'
          # Pour mieux voir les résultats
          browser: chrome
          headless: true